# Shared CI builds committed sources without dependency-mutating hooks.
before:
  hooks:
  - go mod tidy
builds:
- env:
  - CGO_ENABLED=0
  goos:
  - linux
  - windows
  - darwin
  goarch:
  - arm64
  - amd64
  ignore:
  - goos: windows
    goarch: arm64
  main: cmd/manager/main.go
archives:
- name_template: '{{ .ProjectName }}_ {{- .Os }}_ {{- if eq .Arch "amd64" }}x86_64
    {{- else if eq .Arch "386" }}i386 {{- else }}{{ .Arch }}{{ end }} {{- if .Arm
    }}v{{ .Arm }}{{ end }}'
  format_overrides:
  - goos: windows
    formats:
    - zip
  files:
  - deploy/**/*
  - LICENSE
  formats:
  - tar.gz
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '{{ incpatch .Version }}-next'
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
release:
  name_template: v{{.Version}}
version: 2
