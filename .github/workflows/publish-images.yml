# Delete temporary images only after every registry publisher succeeds.
name: Publish validated images
'on':
  workflow_run:
    workflows:
    - Public fork CI
    types:
    - completed
permissions:
  contents: read
  actions: read
  pull-requests: read
  packages: write
  id-token: write
jobs:
  keycloak-operator-ecr:
    uses: ./.github/workflows/publish-image-v2.yml
    with:
      registry: ecr
      image-artifact: image
      image-name: keycloak-operator
      build-workflow: .github/workflows/ci.yml
  keycloak-operator-ghcr:
    uses: ./.github/workflows/publish-image-v2.yml
    with:
      registry: ghcr
      image-artifact: image
      image-name: keycloak-operator
      build-workflow: .github/workflows/ci.yml
  cleanup:
    needs:
    - keycloak-operator-ecr
    - keycloak-operator-ghcr
    permissions:
      actions: write
    uses: ./.github/workflows/cleanup-images-v2.yml
    with:
      artifact-names: image
